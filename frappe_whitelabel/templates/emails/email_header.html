{% set brand = get_jinja_branding() %}
<table class="email-header" border="0" cellpadding="0" cellspacing="0" width="100%" style="background: {{ brand.primary_color }};">
	<tr>
		<td style="padding: 16px 20px;">
			{% if brand.logo %}
			<img src="{{ brand.logo }}" alt="{{ brand.product_name }}" style="max-height: 28px; display: block;">
			{% endif %}
			<h1 class="email-header-title" style="color: #ffffff; font-size: 16px; margin: 12px 0 0 0;">
				{% if indicator %}
				<span class="indicator indicator-{{ indicator }}"></span>
				{% endif %}
				<span>{{ header_title }}</span>
			</h1>
		</td>
	</tr>
</table>
