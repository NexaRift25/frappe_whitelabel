{% extends "templates/web.html" %}

{%- block title -%}{{ app_name or _("Not Found") }}{%- endblock -%}

{% block page_content %}
<script>
	window.is_404 = true;
</script>
<div class="error-page">
	<div>
		<h2 class="mb-1 mt-4">{{ _("There's nothing here") }}</h2>
		<div class="text-muted error-text">
			{{ _("The page you are looking for is unavailable.") }}
		</div>
		<div class="mt-6 back-to-home">
			<a href="/" class="btn btn-primary">{{ _("Back to Home") }}</a>
		</div>
	</div>
</div>
{% endblock %}
